<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="A local model by default. Any server that speaks the OpenAI-style chat completions API. Anthropic is optional. Only used if you set ANTHROPIC_API_KEY yourself. One JSON file a day. Every scored role, best first, with the reason."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="296.4" height="133" rx="10"/></clipPath><rect width="296.4" height="133" rx="10" fill="url(#n)"/><rect width="296.4" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="295.4" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="150" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">💻 A local model by default</text><text x="150" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Any server that speaks the</text><text x="150" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">OpenAI-style chat completions</text><text x="150" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">API.</text></g><g transform="translate(308.4,0)"><clipPath id="c0_1"><rect width="264.5" height="133" rx="10"/></clipPath><rect width="264.5" height="133" rx="10" fill="url(#n)"/><rect width="264.5" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="263.5" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="134" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7"